# sing-box 基准配置模板 (Base Template)
# 针对不同 sing-box 版本 (如 v1.12 vs v1.14+), 由程序在内存中自动进行 AST 转换

log: {disabled: false, level: info, timestamp: true}

experimental:
  clash_api:
    external_controller: 127.0.0.1:9090
    external_ui: /etc/sing-box/ui
    secret: ""
    external_ui_download_detour: DirectConn
    default_mode: rule
    external_ui_download_url: "{mirror_url}/https://github.com/MetaCubeX/metacubexd/archive/gh-pages.zip"
  cache_file:
    enabled: true
    path: /etc/sing-box/cache.db
    store_fakeip: true
    store_dns: true

# 统一 HTTP 客户端，供远程规则集 / Dashboard 下载引用
http_clients:
  - {tag: hc-direct, detour: DirectConn}

# 原生 gRPC API 服务，可被官方 Dashboard / 图形客户端远程控制
services:
  - type: api
    tag: api-in
    listen: 0.0.0.0
    listen_port: 9091
    secret: ""
    access_control_allow_private_network: true
    dashboard:
      enabled: true
      path: /etc/sing-box/dashboard
      download_url: "{mirror_url}/https://github.com/SagerNet/sing-box-dashboard/archive/refs/heads/gh-pages.zip"
      http_client: hc-direct
      update_interval: 1d

dns:
  servers:
    - {tag: dns_local, type: udp, server: 114.114.114.114}
    - {tag: dns_proxy, type: https, server: 8.8.8.8, detour: DNS}
    - {tag: dns_tailscale, type: tailscale, endpoint: ts-node}
    - {tag: fakeip, type: fakeip, inet4_range: 198.18.0.0/15, inet6_range: fc00::/18}
  rules:
    - {clash_mode: Direct, server: dns_local, client_subnet: 223.5.5.5/24}
    - {clash_mode: Global, server: dns_proxy}
    - {domain_suffix: [ts.net], server: dns_tailscale}
    - {rule_set: geosite-cn, server: dns_local, client_subnet: 223.5.5.5/24}
    - {rule_set: geosite-geolocation-!cn, server: dns_proxy}
  final: dns_proxy
  strategy: ipv4_only
  disable_cache: false
  disable_expire: false
  optimistic: true

inbounds:
  - {type: tproxy, tag: tproxy-in, listen: "::", listen_port: 7895, udp_timeout: 1m}

outbounds:
  - {tag: DIY-Node, type: selector, outbounds: ["{all}"], filter: [{action: include, keywords: ["sec_"]}]}
  - {tag: Proxy, type: selector, outbounds: [DIY-Node, DirectConn, Auto, Select], interrupt_exist_connections: true}
  - {tag: DNS, type: selector, outbounds: [DIY-Node, Proxy], interrupt_exist_connections: true}
  - {tag: YouTube, type: selector, outbounds: [DIY-Node, Proxy], interrupt_exist_connections: true}
  - {tag: OpenAI, type: selector, outbounds: [DIY-Node, Proxy], interrupt_exist_connections: true}
  - {tag: Google, type: selector, outbounds: [DIY-Node, Proxy], interrupt_exist_connections: true}
  - {tag: Github, type: selector, outbounds: [DIY-Node, Proxy, DirectConn], interrupt_exist_connections: true}
  - {tag: Telegram, type: selector, outbounds: [DIY-Node, Proxy], interrupt_exist_connections: true}
  - {tag: Microsoft, type: selector, outbounds: [DirectConn, DIY-Node, Proxy], interrupt_exist_connections: true}
  - {tag: Apple, type: selector, outbounds: [DirectConn, DIY-Node, Proxy], interrupt_exist_connections: true}
  - {tag: Paypal, type: selector, outbounds: [DIY-Node, Proxy], interrupt_exist_connections: true}
  - {tag: Netflix, type: selector, outbounds: [DIY-Node, Proxy], interrupt_exist_connections: true}
  - {tag: TikTok, type: selector, outbounds: [DIY-Node, Proxy]}
  - {tag: Steam, type: selector, outbounds: [DIY-Node, Proxy]}
  - {tag: X, type: selector, outbounds: [DIY-Node, Proxy, DirectConn]}
  - {tag: Porn, type: selector, outbounds: [DIY-Node, Proxy]}
  - {tag: BTC, type: selector, outbounds: [DIY-Node, Auto, Select]}
  - {tag: Select, type: selector, outbounds: ["{all}"], filter: [{action: exclude, keywords: ["网站|地址|剩余|过期|时间|有效|官网|流量|sec|到期"]}]}
  - {tag: Auto, type: urltest, outbounds: ["{all}"], filter: [{action: exclude, keywords: ["网站|地址|剩余|过期|时间|有效|官网|流量|sec|到期"]}], url: https://captive.apple.com/hotspot-detect.html, interval: 5m, tolerance: 100, interrupt_exist_connections: true}
  - {tag: DirectConn, type: direct}

route:
  default_http_client: hc-direct
  default_domain_resolver: dns_local
  auto_detect_interface: true
  final: Proxy
  default_mark: 1
  rules:
    - {action: reject, protocol: udp, port: 443}
    - {action: sniff}
    - {action: hijack-dns, protocol: dns}
    - {action: hijack-dns, port: 53}
    - {ip_cidr: ["100.64.0.0/10", "fd7a:115c:a1e0::/48"], outbound: ts-node}
    - {ip_is_private: true, outbound: DirectConn}
    - {action: reject, rule_set: [geosite-ad1, geosite-ad2]}
    - {action: route, rule_set: [geosite-bank-cn], outbound: DirectConn}
    - {action: route, rule_set: geosite-steam, outbound: Steam}
    - {action: route, rule_set: [geosite-epic, geosite-playstation, geosite-xbox], outbound: Proxy}
    - {action: route, rule_set: [geosite-disney, geosite-hbo, geosite-primevideo, geosite-spotify], outbound: Proxy}
    - {action: route, rule_set: geosite-onedrive, outbound: Microsoft}
    - {action: route, rule_set: geosite-tiktok, outbound: TikTok}
    - {action: route, rule_set: geosite-x, outbound: X}
    - {action: route, protocol: ssh, outbound: DirectConn}
    - {action: route, protocol: bittorrent, outbound: DirectConn}
    - {action: route, clash_mode: direct, outbound: DirectConn}
    - {action: route, clash_mode: global, outbound: Proxy}
    - {action: route, domain: [clash.razord.top, yacd.metacubex.one, yacd.haishan.me, d.metacubex.one], outbound: DirectConn}
    - {action: route, domain_suffix: [z-lib.gs, follow.is, folo.is], outbound: Proxy}
    - {action: route, rule_set: geosite-cryptocurrency, outbound: BTC}
    - {action: route, rule_set: geosite-porn, outbound: Porn}
    - {action: route, rule_set: geosite-private, outbound: DirectConn}
    - {action: route, rule_set: geosite-jd, outbound: DirectConn}
    - {action: route, rule_set: geosite-ali, outbound: DirectConn}
    - {action: route, rule_set: geosite-baidu, outbound: DirectConn}
    - {action: route, rule_set: geosite-bytedance, outbound: DirectConn}
    - {action: route, rule_set: geosite-pdd, outbound: DirectConn}
    - {action: route, rule_set: geosite-bili, outbound: DirectConn}
    - {action: route, rule_set: geosite-meituan, outbound: DirectConn}
    - {action: route, rule_set: geosite-ctrip, outbound: DirectConn}
    - {action: route, rule_set: geosite-tencent, outbound: DirectConn}
    - {action: route, rule_set: geosite-ctm_cn, outbound: DirectConn}
    - {action: route, rule_set: geosite-chat, outbound: OpenAI}
    - {action: route, domain_suffix: [grok.com, z.ai], outbound: OpenAI}
    - {action: route, rule_set: geosite-youtube, outbound: YouTube}
    - {action: route, rule_set: [geosite-github, geosite-sourcehut], outbound: Github}
    - {action: route, rule_set: [geosite-google, geoip-google], outbound: Google}
    - {action: route, rule_set: [geosite-telegram, geoip-telegram], outbound: Telegram}
    - {action: route, rule_set: [geosite-apple, geoip-apple], outbound: Apple}
    - {action: route, rule_set: geosite-microsoft, outbound: Microsoft}
    - {action: route, rule_set: geosite-paypal, outbound: Paypal}
    - {action: route, rule_set: [geosite-netflix, geoip-netflix], outbound: Netflix}
    - {action: route, rule_set: geosite-geolocation-!cn, outbound: Proxy}
    - {action: route, rule_set: [geosite-cn, geoip-cn], outbound: DirectConn}
    - {action: route, rule_set: geoip-private, outbound: DirectConn}

  rule_set:
    - {tag: geosite-bank-cn, type: remote, format: binary, url: "{mirror_url}/https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geosite/category-bank-cn.srs"}
    - {tag: geosite-ad1, type: remote, format: binary, url: "{mirror_url}/https://github.com/Toperlock/sing-box-geosite/raw/main/rule/adservers.srs"}
    - {tag: geosite-ad2, type: remote, format: binary, url: "{mirror_url}/https://raw.githubusercontent.com/privacy-protection-tools/anti-ad.github.io/master/docs/anti-ad-sing-box.srs"}
    - {tag: geosite-ctm_cn, type: remote, format: binary, url: "{mirror_url}/https://github.com/sixban6/rulesets/raw/refs/heads/main/rule/direct_cn.srs"}
    - {tag: geosite-chat, type: remote, format: binary, url: "{mirror_url}/https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geosite/category-ai-chat-!cn.srs"}
    - {tag: geosite-steam, type: remote, format: binary, url: "{mirror_url}/https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geosite/steam.srs"}
    - {tag: geosite-epic, type: remote, format: binary, url: "{mirror_url}/https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/sing/geo/geosite/epicgames.srs"}
