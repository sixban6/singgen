name: Test

on:
  push:
    branches: ['**']
  pull_request:
  # 发布流程在构建前复用本工作流作为门禁
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-24.04
    env:
      SING_BOX_VERSION: '1.14.4'
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Install sing-box ${{ env.SING_BOX_VERSION }}
        run: |
          curl -fsSL -o /tmp/sing-box.tar.gz \
            "https://github.com/SagerNet/sing-box/releases/download/v${SING_BOX_VERSION}/sing-box-${SING_BOX_VERSION}-linux-amd64.tar.gz"
          tar -xzf /tmp/sing-box.tar.gz -C /tmp
          sudo install -m 0755 "/tmp/sing-box-${SING_BOX_VERSION}-linux-amd64/sing-box" /usr/local/bin/sing-box
          sing-box version

      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"; echo "$unformatted"; exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test (including sing-box check end-to-end)
        env:
          # 缺少 sing-box 时让端到端用例失败而不是跳过
          SINGGEN_REQUIRE_SINGBOX: '1'
        run: go test -race ./...
