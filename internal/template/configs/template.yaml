certificate:
  store: mozilla

endpoints:
  - type: tailscale
    tag: ts-node
    auth_key: "{ts_auth_key}"
    state_directory: /var/lib/sing-box/ts
    ephemeral: false
    system_interface: false
    system_interface_name: ""
    accept_routes: true
    advertise_routes: ["{ts_lan_ipcidr}"]
